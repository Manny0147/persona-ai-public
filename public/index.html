<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07080c" />
  <title>Persona-AI · Approval Gate</title>
  <style>
    :root {
      --bg: #07080c;
      --surface: #101218;
      --surface-2: #181b24;
      --border: rgba(255,255,255,0.07);
      --text: #f0f2f8;
      --muted: #8a90a8;
      --accent: #8b9cff;
      --accent-soft: rgba(139,156,255,0.14);
      --success: #3dd68c;
      --danger: #ff6b7a;
      --radius: 18px;
      --font: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: radial-gradient(1200px 600px at 50% -10%, rgba(139,156,255,0.08), transparent 60%), var(--bg);
      color: var(--text);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }
    .app { max-width: 480px; margin: 0 auto; padding: 16px 16px 110px; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0 18px; position: sticky; top: 0; z-index: 20;
      background: linear-gradient(180deg, var(--bg) 65%, transparent);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); display: grid; place-items: center;
      font-size: 1.1rem; cursor: pointer; transition: all 0.15s;
    }
    .back-btn:hover { border-color: rgba(139,156,255,0.4); transform: translateX(-2px); }
    .back-btn:active { transform: scale(0.94); }
    .logo {
      width: 42px; height: 42px; border-radius: 13px;
      background: linear-gradient(145deg, #9aaaff, #5b6fd9 55%, #3d4fb8);
      display: grid; place-items: center; font-weight: 700; color: #fff;
      box-shadow: 0 0 28px rgba(139,156,255,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
      animation: logoGlow 4s ease-in-out infinite;
    }
    @keyframes logoGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(139,156,255,0.35); }
      50% { box-shadow: 0 0 36px rgba(139,156,255,0.55); }
    }
    .brand-text h1 { font-size: 1.18rem; font-weight: 650; letter-spacing: -0.03em; }
    .brand-text p { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }
    .status-pill {
      font-size: 0.68rem; padding: 6px 11px; border-radius: 999px;
      background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
      transition: all 0.3s;
    }
    .status-pill.live { color: var(--success); border-color: rgba(61,214,140,0.35); background: rgba(61,214,140,0.08); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
    .stat {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 16px 10px; text-align: center; transition: transform 0.2s, border-color 0.2s;
    }
    .stat:hover { transform: translateY(-2px); border-color: rgba(139,156,255,0.25); }
    .stat .n { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.03em; transition: color 0.3s; }
    .stat .l { font-size: 0.66rem; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.05em; }
    .section-title {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--muted); margin: 6px 0 14px; font-weight: 600;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 12px;
      animation: cardIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
      transition: border-color 0.2s, transform 0.15s;
    }
    .card:nth-child(1) { animation-delay: 0.02s; }
    .card:nth-child(2) { animation-delay: 0.06s; }
    .card:nth-child(3) { animation-delay: 0.1s; }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .card:active { transform: scale(0.985); }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .platform {
      font-size: 0.7rem; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--accent); background: var(--accent-soft); padding: 4px 9px; border-radius: 7px;
    }
    .time { font-size: 0.68rem; color: var(--muted); }
    .body-text { font-size: 0.96rem; white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; line-height: 1.5; }
    .rationale {
      font-size: 0.78rem; color: var(--muted); border-left: 2px solid rgba(139,156,255,0.3);
      padding-left: 10px; margin-bottom: 14px;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      font-family: inherit; border: none; cursor: pointer; border-radius: 12px;
      font-weight: 600; font-size: 0.84rem; padding: 10px 14px;
      transition: transform 0.12s, opacity 0.15s, box-shadow 0.2s;
    }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-approve {
      background: linear-gradient(180deg, #4ae89a, #2bbf72); color: #062816; flex: 1;
      box-shadow: 0 4px 14px rgba(61,214,140,0.25);
    }
    .btn-approve:hover { box-shadow: 0 6px 18px rgba(61,214,140,0.35); }
    .btn-reject {
      background: var(--surface-2); color: var(--danger); border: 1px solid rgba(255,107,122,0.28);
    }
    .btn-edit {
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    }
    .btn-publish {
      background: linear-gradient(180deg, #9aaaff, #5b6fd9); color: #fff; flex: 1;
      box-shadow: 0 4px 14px rgba(139,156,255,0.3);
    }
    .btn-cycle {
      width: 100%; margin-top: 6px; background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border); padding: 15px; font-size: 0.92rem; border-radius: 14px;
      transition: all 0.2s;
    }
    .btn-cycle:hover { border-color: rgba(139,156,255,0.35); }
    .btn-cycle.pulse { animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(139,156,255,0.4); }
      50% { box-shadow: 0 0 0 10px transparent; }
    }
    .empty {
      text-align: center; padding: 48px 20px; color: var(--muted); font-size: 0.92rem;
      animation: cardIn 0.5s ease both;
    }
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(90px);
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
      padding: 13px 18px; border-radius: 14px; font-size: 0.86rem; z-index: 100;
      opacity: 0; transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      max-width: 88%; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      z-index: 50; align-items: flex-end; justify-content: center; padding: 16px;
      backdrop-filter: blur(4px);
    }
    .modal.open { display: flex; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-sheet {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 22px 22px 16px 16px; width: 100%; max-width: 480px;
      padding: 22px; max-height: 82dvh; overflow-y: auto;
      animation: sheetUp 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes sheetUp {
      from { transform: translateY(40px); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-sheet h3 { font-size: 1.05rem; margin-bottom: 14px; }
    .modal-sheet textarea {
      width: 100%; min-height: 130px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); padding: 12px; font-family: inherit;
      font-size: 0.92rem; resize: vertical; margin-bottom: 14px;
    }
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions button { flex: 1; }
    .btn-save { background: var(--accent); color: #fff; }
    .btn-cancel { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <button class="back-btn" onclick="history.back()" title="Back">←</button>
        <div class="logo">P</div>
        <div class="brand-text">
          <h1>Approval Gate</h1>
          <p>Persona-AI · Neon</p>
        </div>
      </div>
      <div class="status-pill" id="statusPill">…</div>
    </header>

    <div class="stats">
      <div class="stat"><div class="n" id="statPending">–</div><div class="l">Pending</div></div>
      <div class="stat"><div class="n" id="statScheduled">–</div><div class="l">Scheduled</div></div>
      <div class="stat"><div class="n" id="statTrends">–</div><div class="l">Trends</div></div>
    </div>

    <div class="section-title">Queue</div>
    <div id="list"></div>
    <button class="btn-cycle" id="btnCycle" onclick="runCycle()">Run Cycle</button>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal" id="editModal">
    <div class="modal-sheet">
      <h3>Edit draft</h3>
      <textarea id="editText"></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeEdit()">Cancel</button>
        <button class="btn-save" onclick="saveEdit()">Save</button>
      </div>
    </div>
  </div>

  <script>
    const API = "";
    let editId = null;
    let current = null;

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2600);
    }

    function fmtTime(iso) {
      if (!iso) return "";
      try {
        const d = new Date(iso);
        return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      } catch { return iso; }
    }

    function payloadText(p) {
      if (!p) return "";
      if (typeof p === "string") return p;
      return p.text || p.title || p.caption || p.description || JSON.stringify(p);
    }

    async function refresh() {
      try {
        const [status, pending, scheduled, trends] = await Promise.all([
          fetch(API + "/api/status").then(r => r.json()),
          fetch(API + "/api/drafts/pending").then(r => r.json()),
          fetch(API + "/api/drafts/scheduled").then(r => r.json()),
          fetch(API + "/api/trends?limit=5").then(r => r.json()),
        ]);
        document.getElementById("statPending").textContent = pending.length ?? 0;
        document.getElementById("statScheduled").textContent = scheduled.length ?? 0;
        document.getElementById("statTrends").textContent = Array.isArray(trends) ? trends.length : "–";
        const pill = document.getElementById("statusPill");
        pill.textContent = status?.dryRun ? "Dry-run" : "Live";
        pill.classList.toggle("live", !status?.dryRun);

        const list = document.getElementById("list");
        const items = [...(pending || []), ...(scheduled || [])];
        if (!items.length) {
          list.innerHTML = '<div class="empty">No drafts waiting.<br>Run a cycle to generate one.</div>';
          return;
        }
        list.innerHTML = items.map(d => {
          const text = payloadText(d.payload);
          const isScheduled = d.status === "scheduled";
          return `
            <div class="card">
              <div class="card-head">
                <span class="platform">${d.platform}</span>
                <span class="time">${isScheduled ? "⏰ " + fmtTime(d.scheduledFor) : fmtTime(d.createdAt)}</span>
              </div>
              <div class="body-text">${escapeHtml(text)}</div>
              ${d.rationale ? `<div class="rationale">${escapeHtml(d.rationale)}</div>` : ""}
              <div class="actions">
                ${d.status === "pending" ? `
                  <button class="btn-approve" onclick="approve('${d.id}')">Approve</button>
                  <button class="btn-edit" onclick="openEdit('${d.id}')">Edit</button>
                  <button class="btn-reject" onclick="reject('${d.id}')">Reject</button>
                ` : `
                  <button class="btn-publish" onclick="publish('${d.id}')">Publish now</button>
                `}
              </div>
            </div>`;
        }).join("");
      } catch (e) {
        toast("Could not load queue");
        console.error(e);
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">").replace(/"/g, """);
    }

    async function approve(id) {
      const r = await fetch(API + `/api/drafts/${id}/approve`, { method: "POST" });
      if (!r.ok) { const d = await r.json(); return toast(d.error || "Approve failed"); }
      toast("Approved — ready to publish");
      refresh();
    }

    async function reject(id) {
      const r = await fetch(API + `/api/drafts/${id}/reject`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ reason: "Rejected from UI" }),
      });
      if (!r.ok) { const d = await r.json(); return toast(d.error || "Reject failed"); }
      toast("Rejected");
      refresh();
    }

    async function publish(id) {
      const r = await fetch(API + `/api/drafts/${id}/publish`, { method: "POST" });
      const d = await r.json();
      if (!r.ok) return toast(d.error || "Publish failed");
      toast(d.status === "published" ? "Published" : "Result: " + d.status);
      refresh();
    }

    function openEdit(id) {
      editId = id;
      fetch(API + `/api/drafts/${id}`)
        .then(r => r.json())
        .then(d => {
          current = d;
          document.getElementById("editText").value = payloadText(d.payload);
          document.getElementById("editModal").classList.add("open");
        });
    }

    function closeEdit() {
      document.getElementById("editModal").classList.remove("open");
      editId = null;
      current = null;
    }

    async function saveEdit() {
      if (!editId || !current) return;
      const text = document.getElementById("editText").value;
      const payload = { ...(current.payload || {}) };
      if (payload.text !== undefined || !payload.title) payload.text = text;
      else payload.title = text;
      const r = await fetch(API + `/api/drafts/${editId}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ payload }),
      });
      if (!r.ok) { const d = await r.json(); return toast(d.error || "Edit failed"); }
      toast("Draft updated");
      closeEdit();
      refresh();
    }

    async function runCycle() {
      const btn = document.getElementById("btnCycle");
      btn.disabled = true;
      btn.classList.add("pulse");
      btn.textContent = "Thinking…";
      try {
        const r = await fetch(API + "/api/cycle", { method: "POST" });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || "Cycle failed");
        toast(`Draft ready · ${d.platform}`);
        await refresh();
      } catch (e) {
        toast(e.message || "Cycle failed");
      } finally {
        btn.disabled = false;
        btn.classList.remove("pulse");
        btn.textContent = "Run Cycle";
      }
    }

    document.getElementById("editModal").addEventListener("click", e => {
      if (e.target.id === "editModal") closeEdit();
    });

    refresh();
    setInterval(refresh, 25000);
  </script>
</body>
</html>
